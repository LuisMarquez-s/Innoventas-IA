<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InnovVentas - Tienda Tecnológica</title>
    <style>
        
        #chat-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 350px;
            height: 500px;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        #chat-header {
            background-color: #0078D4; /* Azul Azure */
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
        }
        #chat-messages {
            flex-grow: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background-color: #f9f9f9;
        }
        .message {
            max-width: 80%;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }
        .user-message {
            background-color: #0078D4;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 0;
        }
        .bot-message {
            background-color: #e5e5e5;
            color: black;
            align-self: flex-start;
            border-bottom-left-radius: 0;
        }
        #chat-input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #ddd;
            background-color: white;
        }
        #chat-input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
        }
        #send-btn {
            background-color: #0078D4;
            color: white;
            border: none;
            padding: 10px 15px;
            margin-left: 10px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>


    <h1>Bienvenido a InnovVentas</h1>

    
    <div id="chat-widget">
        <div id="chat-header">Asistente Virtual - Mia</div>
        <div id="chat-messages">
            
            <div class="message bot-message">¡Hola! Soy Mia, tu asistente de InnovVentas. Estoy aquí para ayudarte a elegir los mejores equipos y resolver cualquier duda técnica o de pago. ¿En qué te puedo ayudar hoy?</div>
        </div>
        <div id="chat-input-area">
            <input type="text" id="chat-input" placeholder="Escribe tu mensaje aquí..." onkeypress="handleKeyPress(event)">
            <button id="send-btn" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        
        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        async function sendMessage() {
            const inputField = document.getElementById("chat-input");
            const message = inputField.value.trim();
            if (!message) return;

            
            appendMessage(message, "user-message");
            inputField.value = "";


            const typingId = appendMessage("Escribiendo...", "bot-message");

            try {
          
                const response = await fetch("http://localhost:3000/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ prompt: message })
                });

                const data = await response.json();
                
          
                document.getElementById(typingId).innerText = data.reply;
            } catch (error) {
                console.error("Error en la comunicación:", error);
                document.getElementById(typingId).innerText = "Hubo un error de conexión. Intenta de nuevo.";
            }
        }

        function appendMessage(text, className) {
            const chatMessages = document.getElementById("chat-messages");
            const messageDiv = document.createElement("div");
            const messageId = "msg-" + Date.now();
            messageDiv.id = messageId;
            messageDiv.className = `message ${className}`;
            messageDiv.innerText = text;
            chatMessages.appendChild(messageDiv);
            

            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageId;
        }
    </script>
</body>
</html>
